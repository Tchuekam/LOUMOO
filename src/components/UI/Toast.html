<!-- Floating Toast Notification Component -->
<sc-if value="{{ toast }}">
<div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111214;color:#ffffff;padding:10px 18px;border-radius:var(--radius-pill);font:600 12.5px/1.2 var(--font-heading);box-shadow:var(--shadow-lg);z-index:9999;display:flex;align-items:center;gap:8px;max-width:90%;border:1px solid rgba(255,255,255,0.15);animation:fadeIn .2s ease">
  <span>✓</span>
  <span>{{ toast }}</span>
  <button onClick="{{ clearToast }}" style="border:none;background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;font-size:14px;padding:0 0 0 4px">✕</button>
</div>
</sc-if>
