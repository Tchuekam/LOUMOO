<!-- Sponsored Promotions & Ads Momentum Carousel -->
<div class="hs" style="gap:12px;padding:4px 0 12px">
  <button onClick="{{ on.product }}" style="width:280px;border:1px solid var(--color-divider);border-radius:14px;background:var(--color-surface);box-shadow:var(--shadow-sm);padding:14px;text-align:left;color:var(--color-text);cursor:pointer;flex:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="background:var(--color-accent-sale-100);color:var(--color-accent-sale);font:800 9px/1 var(--font-heading);padding:3px 7px;border-radius:var(--radius-pill)">SALE -20%</span>
      <span style="font:600 10px/1 var(--font-body);color:var(--color-text-muted)">Sponsored</span>
    </div>
    <div style="font:800 14px/1.2 var(--font-heading);color:var(--color-text)">MacBook Pro M3 Max</div>
    <div style="font:400 11.5px/1.3 var(--font-body);color:var(--color-text-secondary);margin-top:4px">Official Apple Reseller Douala</div>
    <div style="font:800 14px/1 var(--font-heading);color:var(--color-accent);margin-top:8px">XAF 1 450 000</div>
  </button>

  <button onClick="{{ on.travelDetail }}" style="width:280px;border:1px solid var(--color-divider);border-radius:14px;background:var(--color-surface);box-shadow:var(--shadow-sm);padding:14px;text-align:left;color:var(--color-text);cursor:pointer;flex:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="background:var(--color-accent-100);color:var(--color-accent);font:800 9px/1 var(--font-heading);padding:3px 7px;border-radius:var(--radius-pill)">FLIGHT DEAL</span>
      <span style="font:600 10px/1 var(--font-body);color:var(--color-text-muted)">Sponsored</span>
    </div>
    <div style="font:800 14px/1.2 var(--font-heading);color:var(--color-text)">Douala → Paris CDG</div>
    <div style="font:400 11.5px/1.3 var(--font-body);color:var(--color-text-secondary);margin-top:4px">Direct flight · 2x 23kg luggage</div>
    <div style="font:800 14px/1 var(--font-heading);color:var(--color-accent);margin-top:8px">XAF 485 000</div>
  </button>
</div>
