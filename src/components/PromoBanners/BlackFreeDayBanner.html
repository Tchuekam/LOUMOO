<!-- Black FreeDay Full-Width Cinematic Banner -->
<div style="background:linear-gradient(135deg, #111214 0%, #1c1e24 50%, #292d38 100%);color:#ffffff;padding:18px 20px;border-radius:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,0.08)">
  <div style="position:absolute;top:-20px;right:-20px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle, rgba(255,209,0,0.2) 0%, transparent 70%);pointer-events:none"></div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <span style="background:var(--color-accent-energy);color:#111214;font:800 10px/1 var(--font-heading);letter-spacing:.08em;padding:4px 8px;border-radius:var(--radius-pill)">BLACK FREEDAY</span>
    <span style="font:700 11px/1 var(--font-body);color:rgba(255,255,255,0.7)">LIVE TODAY</span>
  </div>
  <div style="font:800 18px/1.2 var(--font-heading);letter-spacing:-.02em;margin-bottom:6px">
    XAF 1 000 000 in Free Community Gifts
  </div>
  <div style="font:400 12px/1.4 var(--font-body);color:rgba(255,255,255,0.8);max-width:85%">
    Merchants give back. Claim verified promotional gifts or post items with 0% commission today.
  </div>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button onClick="{{ on.freeday }}" style="background:var(--color-accent-energy);color:#111214;border:none;padding:8px 18px;border-radius:var(--radius-pill);font:800 12px/1 var(--font-heading);cursor:pointer;box-shadow:var(--shadow-glow-yellow)">
      Claim a Gift →
    </button>
    <button onClick="{{ on.upload }}" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#ffffff;padding:8px 16px;border-radius:var(--radius-pill);font:700 12px/1 var(--font-heading);cursor:pointer">
      Post Free Listing
    </button>
  </div>
</div>
