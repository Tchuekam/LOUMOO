<!-- Reusable Loumoo Product Card (Insta360 Store Style) -->
<button onClick="{{ on.product }}" class="loumoo-card">
  <div class="loumoo-card-media">
    <span class="loumoo-card-badge badge-new">HOT</span>
    <span style="font:700 9px/1 var(--font-heading);letter-spacing:.08em;color:var(--color-text-muted)">STUDIO PHOTO</span>
  </div>
  <div class="loumoo-card-body">
    <div class="loumoo-card-title">MacBook Air M2 13"</div>
    <div class="loumoo-card-merchant">Orca Electronics · Akwa, Douala</div>
    <div class="loumoo-card-footer">
      <div class="loumoo-card-price">XAF 745 000</div>
      <div class="loumoo-card-rating">★ 4.9</div>
    </div>
  </div>
</button>
