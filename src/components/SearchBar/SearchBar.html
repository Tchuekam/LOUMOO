<!-- Search Bar with Voice and Visual Search Buttons -->
<div style="display:flex;gap:8px;align-items:center">
  <div onClick="{{ on.search }}" style="flex:1;height:42px;border-radius:var(--radius-pill);background:var(--color-surface);border:1px solid var(--color-divider);display:flex;align-items:center;padding:0 14px;gap:10px;cursor:pointer;box-shadow:var(--shadow-xs)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--color-text-muted)"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <span style="font:400 13px/1 var(--font-body);color:var(--color-text-muted)">Search products, hotels, flights…</span>
  </div>
  <button onClick="{{ on.visual }}" title="Visual Camera Search" style="width:42px;height:42px;border-radius:50%;border:1px solid var(--color-divider);background:var(--color-surface);display:flex;align-items:center;justify-content:center;color:var(--color-text);cursor:pointer;box-shadow:var(--shadow-xs)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
  </button>
  <button onClick="{{ on.voice }}" title="Voice Search" style="width:42px;height:42px;border-radius:50%;border:none;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-glow-blue)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
  </button>
</div>
