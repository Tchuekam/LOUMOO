<!-- WhatsApp Shared Contact Card Component -->
<div class="wa-contact-card">
  <div class="wa-contact-top">
    <div class="wa-contact-avatar-img">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
    <div class="wa-contact-details">
      <div class="wa-contact-name-txt">Beckysmile</div>
    </div>
    <button class="wa-forward-btn" title="Forward contact">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v2"/></svg>
    </button>
  </div>
  <div class="wa-contact-btn-row">
    <button class="wa-contact-btn" onClick="{{ on.chat }}">Message</button>
  </div>
</div>
