<!-- WhatsApp Voice Note Audio Player Component -->
<div class="wa-audio-card">
  <button class="wa-audio-play" title="Play audio">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="wa-audio-middle">
    <div class="wa-waveform-container">
      <span class="wa-bar played" style="height:8px"></span>
      <span class="wa-bar played" style="height:14px"></span>
      <span class="wa-bar played" style="height:18px"></span>
      <span class="wa-bar played" style="height:12px"></span>
      <span class="wa-audio-dot"></span>
      <span class="wa-bar" style="height:16px"></span>
      <span class="wa-bar" style="height:20px"></span>
      <span class="wa-bar" style="height:14px"></span>
      <span class="wa-bar" style="height:10px"></span>
      <span class="wa-bar" style="height:16px"></span>
      <span class="wa-bar" style="height:18px"></span>
      <span class="wa-bar" style="height:12px"></span>
      <span class="wa-bar" style="height:8px"></span>
      <span class="wa-bar" style="height:15px"></span>
      <span class="wa-bar" style="height:19px"></span>
      <span class="wa-bar" style="height:11px"></span>
      <span class="wa-bar" style="height:14px"></span>
    </div>
    <div class="wa-audio-time-row">
      <span>0:05</span>
      <span>11:44</span>
    </div>
  </div>
  <div class="wa-audio-avatar-badge">
    <div class="wa-audio-user-pic">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
    <div class="wa-mic-badge-small">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
  </div>
</div>
