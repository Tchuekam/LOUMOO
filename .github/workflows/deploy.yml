name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delivery circuit tests
        run: npm run test:delivery

      - name: Run required validation gate
        run: npm test

  deploy:
    name: Deploy (railwayapp/actions-push)
    runs-on: ubuntu-latest
    needs: validate
    # A step's own env is not visible to its `if`, so the check lives here.
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pushes the pushed commit to Railway. It is inert until the repository
      # secrets below exist — set them once, then every merge to main ships:
      #
      #   RAILWAY_TOKEN      (required)
      #     Railway Dashboard -> Account -> Tokens -> New Token
      #     then GitHub repo -> Settings -> Secrets and variables -> Actions
      #     -> New repository secret -> RAILWAY_TOKEN
      #
      #   RAILWAY_SERVICE_ID (recommended; targets one service)
      #     Railway Dashboard -> Service -> Settings -> General -> Service ID
      #
      #   Alternative: set RAILWAY_PROJECT_ID instead of RAILWAY_SERVICE_ID to
      #   ship to the project's default branch target.
      # Railway also deploys main from its own git link, so without the token this
      # step is skipped (with a notice) instead of failing every run.
      - name: Note when the Railway token is not configured
        if: env.HAS_RAILWAY_TOKEN != 'true'
        run: echo "::notice::RAILWAY_TOKEN is not set; Railway deploys main from its git link, so this push step is skipped."

      - name: Deploy to Railway
        if: env.HAS_RAILWAY_TOKEN == 'true'
        uses: railwayapp/actions-push@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID }}
          # project: ${{ secrets.RAILWAY_PROJECT_ID }}
          # verbose: true
